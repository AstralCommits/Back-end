spring:
  datasource:
    url: ${SQLITE_URL:jdbc:sqlite:./data/confeccoes.db}
    username:
    password:
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false

# Perfil de compatibilidade local; migrações MySQL não são aplicadas automaticamente.
