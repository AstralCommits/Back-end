spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/confeccoes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Recife&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Antes de iniciar este perfil, aplique database/migrations/V0_3_2__origem_dado_lancamento.sql
# no banco confeccoes existente.
