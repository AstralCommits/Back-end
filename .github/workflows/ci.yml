name: Back-end CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build e testes (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validar com Maven
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
      - name: Enviar análise ao SonarQube institucional
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            mvn --batch-mode --no-transfer-progress sonar:sonar \
              -Dsonar.host.url="$SONAR_HOST_URL" \
              -Dsonar.projectKey="${SONAR_PROJECT_KEY:-trama-backend}" \
              -Dsonar.qualitygate.wait=true
          else
            echo "SonarQube não executado: configure SONAR_TOKEN e SONAR_HOST_URL nas configurações do repositório."
          fi
